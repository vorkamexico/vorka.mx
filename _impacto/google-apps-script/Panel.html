<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--ink:#111;--muted:#666;--line:#e3e3e3;--bg:#fafafa;--card:#fff;--ok:#1f7a3f;--bad:#b42318;--warn:#a15c00}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
  .brand{font-size:12px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  h1{font-size:24px;margin:6px 0 4px} h2{font-size:18px;margin:0 0 12px}
  p.sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  .hint{font-weight:400;color:var(--muted)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;font:inherit;background:#fff}
  textarea{min-height:80px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  button{font:inherit;font-weight:600;border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
  button.sec{background:#fff;color:var(--ink)} button.link{background:none;border:none;color:var(--muted);padding:4px 8px;text-decoration:underline}
  button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.5;cursor:wait}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
  .check input{width:auto;margin-top:3px}
  .msg{padding:12px 14px;border-radius:8px;margin:14px 0;font-size:14px}
  .msg.ok{background:#e8f5ec;color:var(--ok)} .msg.err{background:#fdecea;color:var(--bad)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .tabs button{background:none;color:var(--muted);border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .search{margin-bottom:12px}
  .grupo{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
  .persona{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .persona:first-of-type{border-top:none}
  .persona b{display:block} .persona small{color:var(--muted)}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .acciones button{padding:7px 10px;font-size:13px}
  .sol{padding:12px 0;border-top:1px solid var(--line)} .sol:first-child{border-top:none}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:6px}
  .pill.pendiente{background:#fff4e0;color:var(--warn)} .pill.aprobada{background:#e8f5ec;color:var(--ok)} .pill.rechazada{background:#fdecea;color:var(--bad)}
  dialog{border:none;border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog .in{padding:22px;overflow:auto;max-height:92vh}
  .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .vacio{color:var(--muted);padding:16px 0}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ACCESO -->
  <section id="vLogin" class="hidden">
    <div class="brand">IMPACTO</div>
    <h1>Movimientos de la estructura</h1>
    <p class="sub">Altas, bajas, cambios de presidente y correcciones. Por ahora solo para presidencias estatales.</p>
    <div class="card" style="max-width:440px">
      <label for="correo">Tu correo registrado en IMPACTO</label>
      <input id="correo" type="email" autocomplete="email" placeholder="nombre@gmail.com">
      <div id="loginMsg"></div>
      <div class="pie"><button id="btnAcceso">Enviarme el enlace</button></div>
    </div>
  </section>

  <!-- PANEL -->
  <section id="vPanel" class="hidden">
    <div class="top">
      <div>
        <div class="brand">IMPACTO · Movimientos</div>
        <h1 id="hNombre"></h1>
        <div class="sub" id="hCargo" style="color:var(--muted)"></div>
      </div>
      <button class="link" id="btnSalir">Salir</button>
    </div>

    <div class="tabs">
      <button data-tab="tEstructura" class="on">Mi estructura</button>
      <button data-tab="tAlta">Nueva alta</button>
      <button data-tab="tSolicitudes">Solicitudes</button>
    </div>
    <div id="panelMsg"></div>

    <div id="tEstructura" class="tab">
      <input id="buscar" class="search" placeholder="Buscar por nombre o municipio">
      <div id="listaEstructura"></div>
    </div>

    <div id="tAlta" class="tab hidden">
      <div class="card">
        <h2>Solicitud de alta</h2>
        <p class="sub" style="margin:0">Dirección Nacional la revisa. Al aprobarse, la persona recibe su bienvenida y nombramiento.</p>
        <form id="fAlta" autocomplete="off">
          <div class="row2">
            <div><label>Cargo</label><select name="cargo" required></select></div>
            <div><label>Estructura</label><select name="estructura" required></select></div>
          </div>
          <div class="row2">
            <div id="campoEstado"><label>Estado</label><select name="estado"></select></div>
            <div id="campoResultado"><label>Municipio, alcaldía o distrito</label><input name="resultado" placeholder="Ej. Irapuato"></div>
          </div>
          <div id="camposPersonaAlta"></div>
          <label>¿Quién la propone? <span class="hint">(opcional)</span></label><input name="propone">
          <div class="pie"><button type="submit">Enviar solicitud</button></div>
        </form>
      </div>
    </div>

    <div id="tSolicitudes" class="tab hidden"><div class="card" id="listaSolicitudes"></div></div>
  </section>

  <div id="cargando" class="vacio">Cargando…</div>
</div>

<!-- FORMULARIOS EN VENTANA -->
<dialog id="dlg"><div class="in">
  <div class="brand" id="dlgTipo"></div>
  <h2 id="dlgTitulo" style="margin-top:6px"></h2>
  <div id="dlgPersona" class="sub"></div>
  <form id="fDlg" autocomplete="off"></form>
</div></dialog>

<template id="tplPersona">
  <label>Nombre completo</label><input name="nombre" required>
  <div class="row2">
    <div><label>Teléfono (WhatsApp)</label><input name="telefono" inputmode="tel" required></div>
    <div><label>Correo</label><input name="correo" type="email" required></div>
  </div>
  <label>Redes sociales <span class="hint">(opcional)</span></label><input name="rrss" placeholder="@usuario">
  <label>Foto para el directorio <span class="hint">(opcional, de frente)</span></label><input name="foto" type="file" accept="image/jpeg,image/png,image/webp">
  <label class="check"><input type="checkbox" name="privacidad" required>
    <span>La persona leyó y aceptó el <a target="_blank" rel="noopener" id="lnkPriv">aviso de privacidad</a> y está de acuerdo en aparecer en el directorio público.</span></label>
</template>

<script>
  var SESION = '<?= sesion ?>';
  var CAT = <?!= catalogos ?>;
  var DATOS = null;

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function msg(el, texto, tipo) { el.innerHTML = texto ? '<div class="msg ' + (tipo || 'ok') + '">' + esc(texto) + '</div>' : ''; }
  function mostrar(id) { ['vLogin','vPanel','cargando'].forEach(function (x) { $('#' + x).classList.toggle('hidden', x !== id); }); }
  function llamar(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, mal) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { mal(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
  }
  function opciones(sel, lista, vacio) {
    sel.innerHTML = (vacio ? '<option value="">' + vacio + '</option>' : '') + lista.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
  }

  /* ---------- acceso ---------- */
  $('#btnAcceso').onclick = function () {
    var b = this; b.disabled = true;
    llamar('pedirAcceso', $('#correo').value).then(function (r) { msg($('#loginMsg'), r.mensaje, r.ok ? 'ok' : 'err'); })
      .catch(function (e) { msg($('#loginMsg'), e.message, 'err'); }).then(function () { b.disabled = false; });
  };
  $('#correo').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#btnAcceso').click(); });
  $('#btnSalir').onclick = function () { SESION = ''; DATOS = null; mostrar('vLogin'); };

  /* ---------- panel ---------- */
  function cargar() {
    mostrar('cargando');
    return llamar('datosPanel', SESION).then(function (d) {
      DATOS = d;
      $('#hNombre').textContent = d.usuario.nombre;
      $('#hCargo').textContent = d.usuario.esAdmin ? 'Dirección Nacional · todos los estados' : (d.usuario.cargo + ' · ' + d.usuario.estado);
      $('#campoEstado').classList.toggle('hidden', !d.usuario.esAdmin);
      pintarEstructura(); pintarSolicitudes();
      mostrar('vPanel');
    }).catch(function (e) { mostrar('vLogin'); msg($('#loginMsg'), e.message, 'err'); });
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('hidden', t.id !== b.dataset.tab); });
      msg($('#panelMsg'), '');
    };
  });

  var ORDEN_E = {estatal:0, distrital:1, municipal:2, nacional:-1};
  var ORDEN_C = {presidente:0, vicepresidente:1, 'vicepresidente regional':1, consejero:2, director:3, 'secretaría':4, representante:5};
  function pintarEstructura() {
    var q = $('#buscar').value.trim().toLowerCase();
    var lista = DATOS.lideres.filter(function (p) { return !q || (p.nombre + ' ' + p.resultado + ' ' + p.estado).toLowerCase().indexOf(q) !== -1; });
    lista.sort(function (a, b) {
      return (a.estado.localeCompare(b.estado, 'es')) || ((ORDEN_E[a.estructura] || 0) - (ORDEN_E[b.estructura] || 0)) ||
        a.resultado.localeCompare(b.resultado, 'es') || ((ORDEN_C[a.cargo] || 9) - (ORDEN_C[b.cargo] || 9));
    });
    if (!lista.length) { $('#listaEstructura').innerHTML = '<div class="vacio">No hay personas que coincidan.</div>'; return; }
    var html = '', grupo = '';
    lista.forEach(function (p) {
      var g = (DATOS.usuario.esAdmin ? p.estado + ' · ' : '') + (p.estructura === 'estatal' ? 'Estatal' : p.resultado);
      if (g !== grupo) { html += (grupo ? '</div>' : '') + '<div class="grupo">' + esc(g) + '</div><div class="card" style="padding:4px 16px">'; grupo = g; }
      var propio = p.correo && p.correo.toLowerCase() === DATOS.usuario.correo;
      html += '<div class="persona"><div><b>' + esc(p.nombre) + '</b><small>' + esc(p.cargo + ' ' + p.estructura) +
        (p.id ? ' · ' + esc(p.id) : '') + '</small></div><div class="acciones">' +
        (propio && !DATOS.usuario.esAdmin ? '<small style="color:var(--muted)">Tu cargo</small>' :
        '<button class="sec" data-a="cambio" data-id="' + esc(p.id) + '">Cambiar persona</button>' +
        '<button class="sec" data-a="correccion" data-id="' + esc(p.id) + '">Corregir</button>' +
        '<button class="danger" data-a="baja" data-id="' + esc(p.id) + '">Baja</button>') + '</div></div>';
    });
    $('#listaEstructura').innerHTML = html + '</div>';
  }
  $('#buscar').addEventListener('input', pintarEstructura);
  $('#listaEstructura').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var p = DATOS.lideres.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (!p || !p.id) { msg($('#panelMsg'), 'Esta persona aún no tiene ID. Pide a Dirección Nacional correr la configuración.', 'err'); return; }
    abrir(b.dataset.a, p);
  });

  function pintarSolicitudes() {
    var s = DATOS.solicitudes;
    $('#listaSolicitudes').innerHTML = s.length ? s.map(function (x) {
      return '<div class="sol"><span class="pill ' + esc(x.estatus) + '">' + esc(x.estatus) + '</span><b>' + esc(x.folio) + '</b> · <small>' + esc(x.fecha) + '</small>' +
        '<div>' + esc(x.resumen) + '</div>' + (DATOS.usuario.esAdmin ? '<small style="color:var(--muted)">Pidió: ' + esc(x.solicitante) + '</small>' : '') +
        (x.motivoRechazo ? '<div style="color:var(--bad);font-size:14px">Motivo: ' + esc(x.motivoRechazo) + '</div>' : '') + '</div>';
    }).join('') : '<div class="vacio">Aún no has enviado solicitudes.</div>';
  }

  /* ---------- formularios ---------- */
  function camposPersona(cont) {
    cont.innerHTML = $('#tplPersona').innerHTML;
    var l = cont.querySelector('#lnkPriv'); if (l) { l.href = CAT.privacidad; l.removeAttribute('id'); }
  }

  function datosDe(form) {
    var d = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name || el.type === 'file') return;
      d[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return d;
  }

  function leerFoto(form) {
    var inp = form.querySelector('input[type=file]');
    var f = inp && inp.files && inp.files[0];
    if (!f) return Promise.resolve(null);
    return new Promise(function (ok, mal) {
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () {
        var max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok({ nombre: f.name, mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.86).split(',')[1] });
      };
      img.onerror = function () { mal(new Error('No pude leer la foto. Prueba con otra en JPG o PNG.')); };
      img.src = url;
    });
  }

  function enviar(form, tipo, extra, alTerminar) {
    var btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    var datos = Object.assign(datosDe(form), extra || {});
    var aviso = form.querySelector('.formMsg') || form.appendChild(Object.assign(document.createElement('div'), { className: 'formMsg' }));
    msg(aviso, '');
    leerFoto(form).then(function (foto) {
      if (foto) datos.conFoto = true;
      return llamar('enviarSolicitud', SESION, tipo, datos, foto);
    }).then(function (r) {
      alTerminar && alTerminar();
      form.reset();
      msg($('#panelMsg'), r.mensaje, 'ok');
      return llamar('datosPanel', SESION).then(function (d) { DATOS = d; pintarEstructura(); pintarSolicitudes(); });
    }).catch(function (e) { msg(aviso, e.message, 'err'); })
      .then(function () { btn.disabled = false; });
  }

  // Alta
  (function () {
    var f = $('#fAlta');
    opciones(f.cargo, CAT.cargos); opciones(f.estructura, CAT.estructuras); opciones(f.estado, CAT.estados, 'Elige…');
    f.estructura.value = 'municipal';
    camposPersona($('#camposPersonaAlta'));
    var sync = function () { $('#campoResultado').classList.toggle('hidden', f.estructura.value === 'estatal'); };
    f.estructura.onchange = sync; sync();
    f.onsubmit = function (e) { e.preventDefault(); enviar(f, 'alta'); };
  })();

  var TITULOS = {
    cambio: ['Cambio de persona', 'Sale quien ocupa el cargo y entra alguien nuevo en el mismo lugar.'],
    correccion: ['Corrección de datos', 'Llena solo lo que cambia.'],
    baja: ['Baja', 'La persona sale de la estructura. Queda guardada en el historial.']
  };
  function abrir(tipo, p) {
    var f = $('#fDlg'), dlg = $('#dlg');
    $('#dlgTipo').textContent = p.cargo + ' ' + p.estructura + ' · ' + (p.estructura === 'estatal' ? p.estado : p.resultado + ', ' + p.estado);
    $('#dlgTitulo').textContent = TITULOS[tipo][0];
    $('#dlgPersona').innerHTML = esc(TITULOS[tipo][1]) + '<br><b>' + esc(p.nombre) + '</b>';
    var pie = '<div class="pie"><button type="button" class="sec" id="dlgCancelar">Cancelar</button><button type="submit">' +
      (tipo === 'baja' ? 'Solicitar baja' : 'Enviar solicitud') + '</button></div>';

    if (tipo === 'baja') {
      f.innerHTML = '<label>Motivo de la baja</label><textarea name="motivo" required placeholder="Ej. renuncia, inactividad de 3 meses…"></textarea>' + pie;
    } else if (tipo === 'cambio') {
      f.innerHTML = '<h2 style="font-size:15px;margin:18px 0 0">Persona que entra</h2><div id="dlgCampos"></div>' +
        '<label>Motivo del cambio <span class="hint">(opcional)</span></label><input name="motivo">' +
        '<label class="check"><input type="checkbox" name="agradecer" checked><span>Enviar agradecimiento a quien sale</span></label>' + pie;
      camposPersona($('#dlgCampos'));
    } else {
      f.innerHTML =
        '<label>Nombre completo</label><input name="nombre" value="' + esc(p.nombre) + '">' +
        '<div class="row2"><div><label>Teléfono</label><input name="telefono" value="' + esc(p.telefono) + '"></div>' +
        '<div><label>Correo</label><input name="correo" type="email" value="' + esc(p.correo) + '"></div></div>' +
        '<label>Redes sociales</label><input name="rrss" value="' + esc(p.rrss) + '">' +
        '<div class="row2"><div><label>Cargo</label><select name="cargo"></select></div>' +
        (p.estructura === 'estatal' ? '<div></div>' : '<div><label>Municipio / distrito</label><input name="resultado" value="' + esc(p.resultado) + '"></div>') + '</div>' +
        '<label>Foto nueva <span class="hint">(opcional)</span></label><input name="foto" type="file" accept="image/jpeg,image/png,image/webp">' +
        '<label>¿Qué se corrige y por qué? <span class="hint">(opcional)</span></label><input name="motivo">' + pie;
      opciones(f.cargo, CAT.cargos); f.cargo.value = p.cargo;
    }
    $('#dlgCancelar').onclick = function () { dlg.close(); };
    f.onsubmit = function (e) { e.preventDefault(); enviar(f, tipo, { id: p.id }, function () { dlg.close(); }); };
    dlg.showModal();
  }

  /* ---------- arranque ---------- */
  if (SESION) cargar(); else mostrar('vLogin');
</script>
</body>
</html>
