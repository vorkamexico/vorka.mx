<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fafafa;color:#111;font-size:15px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:32px 16px}
  .brand{font-size:12px;letter-spacing:.25em;color:#666;text-transform:uppercase}
  h1{font-size:22px;margin:6px 0 16px}
  .card{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:20px}
  textarea{width:100%;box-sizing:border-box;min-height:80px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:6px}
  button{font:inherit;font-weight:600;border-radius:8px;padding:12px 20px;cursor:pointer;border:1px solid #111;background:#111;color:#fff}
  button.no{background:#fff;color:#b42318;border-color:#b42318}
  button:disabled{opacity:.5}
  .pie{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
  .msg{padding:12px 14px;border-radius:8px;margin-top:16px}
  .ok{background:#e8f5ec;color:#1f7a3f}.err{background:#fdecea;color:#b42318}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eee}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">IMPACTO · Dirección Nacional</div>
  <h1 id="titulo">Movimiento por aprobar</h1>
  <div class="card" id="contenido"></div>
</div>
<script>
  var P = { folio: '<?= folio ?>', para: '<?= para ?>', firma: '<?= firma ?>', decision: '<?= decision ?>' };
  var D = <?!= datos ?>;
  var c = document.getElementById('contenido');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]; }); };

  if (D.error || !D.solicitud) {
    c.innerHTML = '<div class="msg err">' + esc(D.error || 'No encontré la solicitud.') + '</div>';
  } else {
    var s = D.solicitud;
    var pend = s.estatus === 'pendiente';
    c.innerHTML = '<div><span class="pill">' + esc(s.folio) + '</span> <span class="pill">' + esc(s.estatus) + '</span></div>' +
      '<p><b>' + esc(s.resumen) + '</b></p>' + s.detalle +
      '<p style="color:#666;font-size:14px">Lo pidió ' + esc(s.solicitante) + ' el ' + esc(s.fecha) + '.</p>' +
      (pend ?
        '<label for="motivo" style="font-weight:600;font-size:13px">Motivo <span style="font-weight:400;color:#666">(obligatorio si rechazas)</span></label>' +
        '<textarea id="motivo"></textarea>' +
        '<div class="pie"><button id="si">Aprobar</button><button class="no" id="no">Rechazar</button></div>' :
        '<div class="msg ok">Esta solicitud ya está ' + esc(s.estatus) + '.</div>') +
      '<div id="res"></div>';
    if (pend) {
      if (P.decision === 'rechazar') document.getElementById('motivo').focus();
      var accion = function (d) {
        return function () {
          var b1 = document.getElementById('si'), b2 = document.getElementById('no'); b1.disabled = b2.disabled = true;
          google.script.run
            .withSuccessHandler(function (r) {
              document.getElementById('res').innerHTML = '<div class="msg ok">' + esc(r.mensaje) + '</div>';
              b1.remove(); b2.remove(); document.getElementById('motivo').disabled = true;
            })
            .withFailureHandler(function (e) {
              document.getElementById('res').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>';
              b1.disabled = b2.disabled = false;
            })
            .resolver(P.folio, P.para, P.firma, d, document.getElementById('motivo').value);
        };
      };
      document.getElementById('si').onclick = accion('aprobar');
      document.getElementById('no').onclick = accion('rechazar');
    }
  }
</script>
</body>
</html>
