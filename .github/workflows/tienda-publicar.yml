# Publica la tienda (Worker vorka-tienda: vorka.mx/tienda, /api, /descargas, /cupo, /brindi…) con un botón, desde el celular.
# GitHub → Actions → "Tienda — publicar" → Run workflow. Corre las pruebas y, si pasan, publica lo que está en main.
# No corre migraciones de la base: si un cambio las necesita, se aplican aparte (ver _tienda/README-TIENDA.md).
# Necesita el secreto CLOUDFLARE_API_TOKEN (Account · Workers Scripts · Edit y Zone · Workers Routes · Edit en vorka.mx).
name: Tienda — publicar

on:
  workflow_dispatch:

concurrency:
  group: tienda-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: _tienda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tienda/package-lock.json
      - run: npm ci
      - name: Pruebas de la tienda
        run: npx vitest run --reporter=dot
      - name: Publicar en Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80b4468565b92fe211eab36f31116f9b
      - name: Revisar que responda
        run: |
          for u in https://vorka.mx/tienda/ https://vorka.mx/tienda/brindi/ https://vorka.mx/api/tienda/salud; do
            printf "%-40s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done
