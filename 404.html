<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Vorka México</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/vorka-logo.png">
<style>
:root{--ink:#F5F2EC;--oro:#E6CF96;--fondo:#0A0908}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--fondo);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.pag{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:28px clamp(20px,5vw,64px);isolation:isolate;overflow:hidden}
.fondo{position:absolute;inset:0;z-index:-1}
.fondo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.fondo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.55) 0%,rgba(10,9,8,.35) 40%,rgba(10,9,8,.9) 100%)}
.marca{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;letter-spacing:-.01em}
.marca img{width:34px;height:auto;filter:brightness(0) invert(1)}
.marca span{opacity:.6;font-weight:500}
main{max-width:640px;padding:12vh 0 8vh}
.ojo{color:var(--oro);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
h1{font-size:clamp(38px,7vw,72px);line-height:1.02;letter-spacing:-.035em;margin:16px 0 18px;text-shadow:0 1px 18px rgba(0,0,0,.4)}
h1 em{font-style:normal;color:var(--oro)}
p{font-size:clamp(16px,2.2vw,19px);line-height:1.55;color:rgba(245,242,236,.85);max-width:520px}
.acc{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none}
.btn.prim{background:var(--ink);color:#141210}
.btn.sec{color:#fff;border:1px solid rgba(255,255,255,.45)}
.btn:hover{opacity:.9}
.btn:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.credito{font-size:12px;color:rgba(245,242,236,.7);text-align:right}
.credito a{color:inherit}
</style>
</head>
<body>
<div class="pag">
  <div class="fondo"><img src="/img/ciudades/cdmx-1600.webp" srcset="/img/ciudades/cdmx-960.webp 960w, /img/ciudades/cdmx-1600.webp 1600w, /img/ciudades/cdmx-2400.webp 2400w" sizes="100vw" alt=""></div>
  <a class="marca" href="/"><img src="/vorka-logo.png" alt="">Vorka <span>México</span></a>
  <main>
    <div class="ojo">Error 404</div>
    <h1>Esta ruta no está en <em>el mapa.</em></h1>
    <p>La página que buscas cambió de lugar o ya no existe. Desde aquí te llevamos a donde sí pasan las cosas.</p>
    <div class="acc">
      <a class="btn prim" href="/">Ir al inicio →</a>
      <a class="btn sec" href="/sparks/">Revista Sparks</a>
    </div>
  </main>
  <div class="credito">Ciudad de México · Foto: <a href="https://unsplash.com/photos/nEj6sIzBht4" target="_blank" rel="noopener">Diwei Zhu</a> / Unsplash</div>
</div>
</body>
</html>
